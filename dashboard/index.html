<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerLens — Reconciliation Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFCFA;
    --paper-dim:#F4F2EC;
    --ink:#1B1D1F;
    --ink-dim:#5B5D60;
    --hair:#DEDAD0;
    --navy:#14213D;
    --teal:#0F6E56;
    --teal-bg:#E7F3EF;
    --amber:#B4690E;
    --amber-bg:#FBEEDE;
    --rust:#A23B1E;
    --rust-bg:#FAEAE4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

  header{
    border-bottom:1px solid var(--hair);
    padding:28px clamp(20px,5vw,64px) 24px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{
    width:10px;height:10px;background:var(--navy);
    display:inline-block;flex-shrink:0;transform:translateY(-2px);
  }
  .brand h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-0.01em;}
  .brand .sub{color:var(--ink-dim);font-size:14px;margin-left:2px;}
  .run-meta{text-align:right;color:var(--ink-dim);font-size:13px;line-height:1.5;}
  .run-meta .num{color:var(--ink);}

  main{max-width:980px;margin:0 auto;padding:0 clamp(20px,5vw,64px) 80px;}

  .hero{
    padding:56px 0 40px;
    border-bottom:1px solid var(--hair);
    display:flex;
    flex-wrap:wrap;
    gap:48px;
    align-items:flex-end;
  }
  .hero-primary .label{color:var(--ink-dim);font-size:14px;margin-bottom:6px;}
  .hero-primary .value{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:clamp(48px,9vw,76px);
    font-weight:500;
    line-height:0.95;
    letter-spacing:-0.02em;
  }
  .hero-primary .value .of{color:var(--ink-dim);font-size:0.5em;font-weight:400;}
  .hero-stats{display:flex;gap:36px;flex-wrap:wrap;padding-bottom:6px;}
  .hero-stat .label{color:var(--ink-dim);font-size:13px;margin-bottom:4px;}
  .hero-stat .value{font-size:28px;font-weight:500;}
  .hero-stat.teal .value{color:var(--teal);}
  .hero-stat.amber .value{color:var(--amber);}

  .claim{
    padding:18px 0 0;
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.6;
    max-width:640px;
  }
  .claim b{color:var(--ink);font-weight:600;}

  .tabs{
    display:flex;
    gap:2px;
    margin-top:40px;
    border-bottom:1px solid var(--hair);
  }
  .tab{
    background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;color:var(--ink-dim);
    padding:10px 4px;margin-right:28px;
    border-bottom:2px solid transparent;
    transition:color .15s ease;
  }
  .tab .count{font-family:'IBM Plex Mono',monospace;}
  .tab.active{color:var(--ink);border-bottom-color:var(--navy);font-weight:500;}
  .tab:hover{color:var(--ink);}

  .list{margin-top:8px;}
  .row{
    border-bottom:1px solid var(--hair);
    padding:16px 0;
    cursor:pointer;
  }
  .row-head{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .row-status{
    width:9px;height:9px;border-radius:50%;flex-shrink:0;
  }
  .row-status.ok{background:var(--teal);}
  .row-status.review{background:var(--amber);}
  .row-status.bad{background:var(--rust);}

  .row-id{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-dim);width:74px;flex-shrink:0;}
  .row-vendor{flex:1;min-width:120px;font-size:14px;}
  .row-amount{font-family:'IBM Plex Mono',monospace;font-size:14px;width:110px;text-align:right;flex-shrink:0;}
  .row-source{
    font-size:11px;color:var(--ink-dim);
    border:1px solid var(--hair);border-radius:3px;
    padding:2px 7px;flex-shrink:0;white-space:nowrap;
  }
  .row-tag{
    font-size:12px;font-weight:500;
    padding:3px 9px;border-radius:3px;flex-shrink:0;
    white-space:nowrap;
  }
  .row-tag.ok{color:var(--teal);background:var(--teal-bg);}
  .row-tag.review{color:var(--amber);background:var(--amber-bg);}
  .row-tag.bad{color:var(--rust);background:var(--rust-bg);}
  .row-chevron{color:var(--hair);font-size:14px;transition:transform .15s ease;flex-shrink:0;width:14px;text-align:center;}
  .row.open .row-chevron{transform:rotate(90deg);color:var(--ink-dim);}

  .row-detail{
    max-height:0;overflow:hidden;
    transition:max-height .2s ease;
  }
  .row.open .row-detail{max-height:400px;}
  .row-detail-inner{
    padding:16px 0 4px 25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 32px;
    font-size:13px;
  }
  .detail-block .k{color:var(--ink-dim);font-size:12px;margin-bottom:4px;}
  .detail-block .v{line-height:1.5;}
  .detail-block .v.num{font-size:13px;}
  .detail-full{grid-column:1 / -1;}
  .override-flag{
    display:inline-block;margin-top:8px;
    background:var(--rust-bg);color:var(--rust);
    font-size:12px;font-weight:500;
    padding:5px 10px;border-radius:3px;
  }

  .overview{padding:32px 0 8px;}
  .overview-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--hair);border:1px solid var(--hair);
    margin-bottom:28px;
  }
  .overview-cell{background:var(--paper);padding:20px 22px;}
  .overview-cell .k{color:var(--ink-dim);font-size:13px;margin-bottom:6px;}
  .overview-cell .v{font-family:'IBM Plex Mono',monospace;font-size:24px;}
  .overview p{font-size:14px;line-height:1.7;color:var(--ink-dim);max-width:620px;}
  .overview p b{color:var(--ink);}

  .exc-breakdown{margin-top:8px;}
  .exc-breakdown-row{
    display:flex;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid var(--hair);
    font-size:14px;
  }
  .exc-breakdown-row .count{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}

  footer{
    border-top:1px solid var(--hair);
    padding:20px clamp(20px,5vw,64px);
    color:var(--ink-dim);font-size:12px;
    display:flex;justify-content:space-between;
  }

  @media (max-width:640px){
    .row-head{flex-wrap:wrap;}
    .row-vendor{order:1;width:100%;}
    .row-detail-inner{grid-template-columns:1fr;}
    .overview-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <h1>LedgerLens</h1>
    <span class="sub">reconciliation ledger</span>
  </div>
  <div class="run-meta" id="runMeta"></div>
</header>

<main>

  <section class="hero" id="hero"></section>

  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>

    <button class="tab" data-tab="matches">Matched records <span class="count" id="matchCount"></span></button>

  <div id="overviewPane" class="overview"></div>
  <div id="exceptionsPane" class="list" style="display:none;"></div>
  <div id="matchesPane" class="list" style="display:none;"></div>

</main>

<footer>
  <span>LedgerLens — AI Reconciliation Controller</span>

</footer>

function fmtRupee(n){
  return '₹' + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pct(n){ return (n*100).toFixed(1) + '%'; }

function statusInfo(rec){
  if (rec.status === 'MATCHED') {
    if (rec.correct === false) return {cls:'bad', label:'False match'};
    return {cls:'ok', label:'Matched'};
  } else {
    if (rec.hard_rule_override) return {cls:'bad', label:'Rule override'};
    return {cls:'review', label:'Exception'};
  }
}

function renderHero(){
  const s = DATA.summary;
  document.getElementById('runMeta').innerHTML =
    `Records evaluated <span class="num">${s.total}</span> · scored against ground truth`;

  document.getElementById('hero').innerHTML = `
    <div class="hero-primary">
      <div class="label">Auto-matched</div>
      <div class="value">${s.matched}<span class="of"> / ${s.total}</span></div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat teal">
        <div class="label">Precision</div>
        <div class="value num">${pct(s.precision)}</div>
      </div>
      <div class="hero-stat teal">
        <div class="label">Recall</div>
        <div class="value num">${pct(s.recall)}</div>
      </div>
      <div class="hero-stat amber">
        <div class="label">Exceptions</div>
        <div class="value num">${s.exceptions}</div>
      </div>
    </div>
    <div class="claim">
      We do not claim 100% accuracy. <b>${s.fp} record${s.fp===1?'':'s'}</b> were matched incorrectly —
      see the exception queue and the flagged rows below for exactly why, rather than a cherry-picked
      success case.
    </div>
  `;
}

function renderOverview(){
  const s = DATA.summary;
  const excTypes = {};
  DATA.records.forEach(r => {
    if (r.status !== 'MATCHED' && r.case_type) {
      excTypes[r.case_type] = (excTypes[r.case_type]||0) + 1;
    }
  });

  let breakdownHtml = Object.entries(excTypes)
    .sort((a,b)=>b[1]-a[1])
    .map(([type,count]) => `
      <div class="exc-breakdown-row">
        <span>${type.replace(/_/g,' ')}</span>
        <span class="count">${count}</span>
      </div>`).join('');

  document.getElementById('overviewPane').innerHTML = `
    <div class="overview-grid">
      <div class="overview-cell">
        <div class="k">Resolved by deterministic rules</div>
        <div class="v">${s.deterministic_count}</div>
      </div>
      <div class="overview-cell">
        <div class="k">Resolved by AI resolver</div>
        <div class="v">${s.ai_count}</div>
      </div>
      <div class="overview-cell">
        <div class="k">True positives (correct matches)</div>
        <div class="v" style="color:var(--teal)">${s.tp}</div>
      </div>
      <div class="overview-cell">
        <div class="k">False positives (wrong matches)</div>
        <div class="v" style="color:var(--rust)">${s.fp}</div>
      </div>
    </div>
    <p>The deterministic layer resolves records with an exact reference,
    amount within fee tolerance, and date within one day — no AI call, no
    cost, no risk of hallucination. The remaining ambiguous records go to the
    AI resolver, which returns a verdict, a confidence score, and its
    reasoning — never a bare yes or no. A hard validation rule sits after the
    AI and can reject any proposed match regardless of stated confidence.</p>
    <p><b>Exceptions by type</b> — every record we did not auto-resolve, categorized:</p>
    <div class="exc-breakdown">${breakdownHtml}</div>
  `;
}

function detailHtml(rec){
  const settlement = rec.matched_settlement;
  const confStr = rec.confidence !== null ? (rec.confidence*100).toFixed(0)+'%' : '—';
  return `
    <div class="row-detail-inner">
      <div class="detail-block">
        <div class="k">Payment</div>
        <div class="v num">${fmtRupee(rec.amount)} · ${rec.date} · ${rec.reference}</div>
      </div>
      <div class="detail-block">
        <div class="k">Matched settlement</div>
        <div class="v num">${settlement ? fmtRupee(settlement.amount)+' · '+settlement.date+' · '+settlement.reference : '— none —'}</div>
      </div>
      <div class="detail-block">
        <div class="k">Resolution source</div>
        <div class="v">${rec.source === 'deterministic' ? 'Deterministic rules (exact match)' : 'AI resolver'}</div>
      </div>
      <div class="detail-block">
        <div class="k">Confidence</div>
        <div class="v num">${confStr}</div>
      </div>
      <div class="detail-block detail-full">
        <div class="k">Reasoning</div>
        <div class="v">${rec.reasoning || '—'}</div>
        ${rec.hard_rule_override ? '<div class="override-flag">Hard rule override — AI-proposed match rejected for exceeding the ₹500 amount-difference safety threshold</div>' : ''}
      </div>
    </div>
  `;
}

function renderRow(rec){
  const info = statusInfo(rec);
  return `
    <div class="row" data-id="${rec.payment_id}">
      <div class="row-head">
        <span class="row-status ${info.cls}"></span>
        <span class="row-id">${rec.payment_id}</span>
        <span class="row-vendor">${rec.vendor}</span>
        <span class="row-amount num">${fmtRupee(rec.amount)}</span>
        <span class="row-source">${rec.source === 'deterministic' ? 'rules' : 'AI'}</span>
        <span class="row-tag ${info.cls}">${info.label}</span>
        <span class="row-chevron">›</span>
      </div>
      <div class="row-detail">${detailHtml(rec)}</div>
    </div>
  `;
}

function renderLists(){
  const exceptions = DATA.records.filter(r => r.status !== 'MATCHED');
  const matches = DATA.records.filter(r => r.status === 'MATCHED');

  document.getElementById('excCount').textContent = exceptions.length;
  document.getElementById('matchCount').textContent = matches.length;

  document.getElementById('exceptionsPane').innerHTML = exceptions.map(renderRow).join('');
  document.getElementById('matchesPane').innerHTML = matches.map(renderRow).join('');

  document.querySelectorAll('.row').forEach(row => {
    row.querySelector('.row-head').addEventListener('click', () => {
      row.classList.toggle('open');
    });
  });
}

function setupTabs(){
  const tabs = document.querySelectorAll('.tab');
  const panes = {
    overview: document.getElementById('overviewPane'),
    exceptions: document.getElementById('exceptionsPane'),
    matches: document.getElementById('matchesPane'),
  };
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(panes).forEach(p => p.style.display = 'none');
      panes[tab.dataset.tab].style.display = 'block';
    });
  });
}

renderHero();
renderOverview();
renderLists();
setupTabs();
</script>
