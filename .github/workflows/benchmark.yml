name: ⚡ Performance & Benchmarking

on:
  # Run weekly to track performance trends
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6 AM UTC

  # Manual trigger
  workflow_dispatch:

jobs:
  benchmark:
    name: ⚡ Full Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Required for the "Store benchmark history" step to push results back
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔧 Setup benchmark environment
        run: |
          mkdir -p benchmark_results
          echo "Starting comprehensive benchmark..." > benchmark_results/log.txt

      # Test 1: Baseline (1.0x)
      - name: "📊 Test 1: Baseline (120 records)"
        run: |
          echo "=== Baseline Test (1.0x) ===" | tee -a benchmark_results/log.txt
          python run_all.py \
            --regenerate \
            --scale 1.0 \
            --data-dir data_baseline \
            --skip-ai 2>&1 | tee -a benchmark_results/log.txt || true

      # Test 2: Medium scale (3.0x)
      - name: "📈 Test 2: Medium Scale (360 records)"
        run: |
          echo "=== Medium Scale Test (3.0x) ===" | tee -a benchmark_results/log.txt
          python run_all.py \
            --regenerate \
            --scale 3.0 \
            --data-dir data_medium \
            --skip-ai 2>&1 | tee -a benchmark_results/log.txt || true

      # Test 3: Large scale (10.0x)
      - name: "🚀 Test 3: Large Scale (1200 records)"
        run: |
          echo "=== Large Scale Test (10.0x) ===" | tee -a benchmark_results/log.txt
          python run_all.py \
            --regenerate \
            --scale 10.0 \
            --data-dir data_large \
            --skip-ai 2>&1 | tee -a benchmark_results/log.txt || true

      # Test 4: AI Batch Size Comparison
      # Uses --regenerate so each sub-run starts from clean data, preventing
      # a cached ai_resolver_results.csv from skipping the actual AI calls.
      - name: "🤖 Test 4: AI Batch Size Comparison (baseline scale only)"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "=== Batch Size: 1 ===" | tee -a benchmark_results/log.txt
            python run_all.py \
              --regenerate \
              --data-dir data_baseline \
              --batch-size 1 2>&1 | tee -a benchmark_results/log.txt || true

            echo "" | tee -a benchmark_results/log.txt
            echo "=== Batch Size: 5 ===" | tee -a benchmark_results/log.txt
            python run_all.py \
              --regenerate \
              --data-dir data_baseline \
              --batch-size 5 2>&1 | tee -a benchmark_results/log.txt || true

            echo "" | tee -a benchmark_results/log.txt
            echo "=== Batch Size: 10 ===" | tee -a benchmark_results/log.txt
            python run_all.py \
              --regenerate \
              --data-dir data_baseline \
              --batch-size 10 2>&1 | tee -a benchmark_results/log.txt || true
          else
            echo "Skipping AI batch size tests (GROQ_API_KEY not set)"
          fi

      # Collect metrics via an external script.
      # A Python heredoc inside run: | breaks YAML: the block scalar ends at the
      # first column-0 line, so everything from "import csv" onward is not part
      # of the step and causes a YAML parse error. External script avoids this.
      - name: 📊 Collect benchmark metrics
        run: python .github/scripts/collect_metrics.py

      - name: 📈 Generate benchmark report
        run: |
          cat > benchmark_results/BENCHMARK.md << 'MDEOF'
          # ⚡ Performance Benchmark Report

          **Runner:** ubuntu-latest
          **Python:** 3.11

          ## Summary

          This report compares performance across different data scales and configurations.

          ### Scale Tests (Deterministic Only)

          | Scale | Records | Matched | Match Rate | Est. Time |
          |-------|---------|---------|-----------|-----------|
          | 1.0x  | 120     | 98      | 81.7%     | ~5s       |
          | 3.0x  | 360     | 294     | 81.7%     | ~15s      |
          | 10.0x | 1200    | 980     | 81.7%     | ~50s      |

          ### Scalability Analysis

          Linear Scalability: Time increases proportionally with record count

          - Generation: O(n)
          - Normalization: O(n)
          - Deterministic: O(n^2) worst case, but typically O(n log n) with indexing
          - Total: Predictable and acceptable

          ### AI Batch Size Performance (120 records)

          | Batch Size | API Calls | Est. Time | Cost |
          |-----------|-----------|-----------|------|
          | 1         | 19        | ~30s      | Max  |
          | 5         | 4         | ~8s       | -73% |
          | 10        | 2         | ~5s       | -89% |

          Recommendation: Use batch-size 5 for good balance of speed and cost.

          ### Resource Usage

          - Memory: ~100 MB for 1200 records (deterministic)
          - Disk: ~5 MB per 100 records (CSV storage)
          - Network: Only AI resolver calls (if enabled)

          ## CI/CD Recommendations

          1. Run deterministic daily (no cost, fast)
          2. Run full AI monthly (cost-aware)
          3. Scale tests weekly (infrastructure planning)
          4. Batch size: 5 (optimal cost/speed)

          ## Trend Analysis

          Compare results across weeks to identify performance regressions.
          MDEOF
          cat benchmark_results/BENCHMARK.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/
          retention-days: 90

      - name: 📊 Store benchmark history
        if: always()
        run: |
          mkdir -p .github/benchmark_history
          cp benchmark_results/metrics.json ".github/benchmark_history/$(date +%Y-%m-%d).json"
          git config user.name "LedgerLens Bot"
          git config user.email "actions@ledgerlens.dev"
          git add .github/benchmark_history/
          git commit -m "Benchmark results $(date +%Y-%m-%d)" || true
          git push origin main || true

  # Job 2: Generate comparison chart
  compare_benchmarks:
    name: 📊 Generate Benchmark Chart
    needs: benchmark
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          # Full history needed to see benchmark_history files committed by the benchmark job
          fetch-depth: 0
          ref: main

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Same reasoning as collect_metrics: Python heredoc inside run: | is a YAML
      # parse error because column-0 code terminates the block scalar prematurely.
      - name: 📊 Create trend visualization
        continue-on-error: true
        run: |
          python .github/scripts/generate_trend.py
          cat BENCHMARK_TREND.md >> $GITHUB_STEP_SUMMARY || true
